# Consider tools like `watchman` which set up per-file inotify watchers
# If this is used with `jj` and is on a large repository (like fuchsia) then
# there will be user watches that exceed the default limit (~16k)
#
# Therefore set it to the max value. We'll still be able to use watchman but
# at an overhead cost of kernel memory (which cannot be paged)
fs.inotify.max_user_watches=524288
