# Herdr configuration (https://herdr.dev)
# Managed via Home Manager (~/.config/herdr/config.toml)

onboarding = false

[theme]
name = "tokyo-night"

[keys]
# Use Ctrl+a as the prefix/leader key to start a chord (pressing Ctrl+a twice sends literal Ctrl+a)
prefix = "ctrl+a"
# Bind prefix+d to detach (matching tmux) instead of the default prefix+q
detach = "prefix+d"

[terminal]
# Inherit the source pane/workspace directory when opening new panes/tabs
new_cwd = "follow"
shell_mode = "auto"

[update]
# Managed via Nix / Home Manager
version_check = false
manifest_check = true

[ui]
mouse_capture = true
copy_on_select = true
show_agent_labels_on_pane_borders = true

[ui.toast]
# Send background notification popups via the OS notification service directly
delivery = "system"

[session]
# Resume supported AI-agent panes into their native conversation sessions
# after a Herdr server restart.
resume_agents_on_restore = true
startup_per_agent_delay_ms = 100
