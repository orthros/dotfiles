[user]
name = "Colin Nelson"
email = "colin@orthros.dev"

[ui]
# diff-editor = "vimdiff"
diff-formatter = "difft"
pager = ":builtin"

[aliases]
accuse = ["file", "annotate"]
mergiraf = ["resolve", "--tool", "mergiraf"]

[revsets]
# The default is 'present(@) | ancestors(immutable_heads().., 2) | present(trunk())'
# but this will only show the last TWO ancestors. We want all of them
# log = "present(@) | ancestors(immutable_heads()..) | present(trunk())"

