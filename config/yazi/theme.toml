# Auto-generated by modules/theme (preset: @preset@)
[mgr]
cwd = { fg = "@teal@" }
find_keyword  = { fg = "@amber@", bold = true, italic = true, underline = true }
find_position = { fg = "@lavender@", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "@cyan@", italic = true }
marker_copied   = { fg = "@aqua@", bg = "@aqua@" }
marker_cut      = { fg = "@urgent@", bg = "@urgent@" }
marker_marked   = { fg = "@cyan@", bg = "@cyan@" }
marker_selected = { fg = "@amber@", bg = "@amber@" }
count_copied   = { fg = "@bg@", bg = "@aqua@" }
count_cut      = { fg = "@bg@", bg = "@urgent@" }
count_selected = { fg = "@bg@", bg = "@amber@" }
border_style  = { fg = "@slate@" }

[tabs]
active   = { fg = "@bg@", bg = "@accent@", bold = true }
inactive = { fg = "@fgMuted@", bg = "@surfaceHover@" }

[mode]
normal_main = { fg = "@bg@", bg = "@accent@", bold = true }
normal_alt  = { fg = "@accent@", bg = "@surfaceHover@" }
select_main = { fg = "@bg@", bg = "@lavender@", bold = true }
select_alt  = { fg = "@lavender@", bg = "@surfaceHover@" }
unset_main  = { fg = "@bg@", bg = "@urgent@", bold = true }
unset_alt   = { fg = "@urgent@", bg = "@surfaceHover@" }

[status]
perm_sep   = { fg = "@slate@" }
perm_type  = { fg = "@aqua@" }
perm_read  = { fg = "@amber@" }
perm_write = { fg = "@urgent@" }
perm_exec  = { fg = "@cyan@" }
progress_label  = { fg = "@fg@", bold = true }
progress_normal = { fg = "@aqua@", bg = "@surfaceHover@" }
progress_error  = { fg = "@amber@", bg = "@urgent@" }

[which]
border          = { fg = "@accent@" }
cand            = { fg = "@cyan@" }
rest            = { fg = "@slate@" }
desc            = { fg = "@lavender@" }
separator_style = { fg = "@slate@" }

[confirm]
border = { fg = "@accent@" }
title  = { fg = "@accent@" }

[spot]
border   = { fg = "@accent@" }
title    = { fg = "@accent@" }
tbl_col  = { fg = "@teal@" }
tbl_cell = { fg = "@amber@", reversed = true }

[notify]
title_info  = { fg = "@aqua@" }
title_warn  = { fg = "@amber@" }
title_error = { fg = "@urgent@" }

[pick]
border = { fg = "@accent@" }
active = { fg = "@lavender@", bold = true }

[input]
border = { fg = "@accent@" }

[cmp]
border = { fg = "@accent@" }

[tasks]
border  = { fg = "@accent@" }
hovered = { fg = "@lavender@", bold = true }

[help]
border = { fg = "@accent@" }
chord  = { fg = "@cyan@" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "@amber@" },
  { mime = "**/{audio,video}/*", fg = "@orange@" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "@purple@" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "@fgMuted@" },
  { mime = "vfs/{absent,stale}", fg = "@slate@" },
  { url = "*", is = "orphan", fg = "@bg@", bg = "@urgent@" },
  { url = "*", is = "exec", fg = "@green@" },
  { url = "*", is = "dummy", fg = "@bg@", bg = "@urgent@" },
  { url = "*/", is = "dummy", fg = "@bg@", bg = "@urgent@" },
  { url = "*/", fg = "@accent@" }
]
