#remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind _ split-window -v
unbind '"'
unbind %

# Kill window and server
bind k confirm kill-window
bind K confirm kill-server

# Resizing
bind < resize-pane -L 1
bind > resize-pane -R 1
bind - resize-pane -D 1
bind + resize-pane -U 1

# Quick reload tmux config
bind r source-file ~/.tmux.conf

# Escape time needs to be lower so that it plays nicely with neovim
# see https://github.com/neovim/neovim/twiki/FAQ
set-option -sg escape-time 10

# For neovim turn on focus events
set-option -g focus-events on

# For neovim use true colors
set-option -sa terminal-overrides ',screen-256color:RGB'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g default-terminal "screen-256color"

# Make status bar a little better to read

## Update the status bar every 30 seconds
set -g status-interval 2

## Put the tmux status in the center
set-option -g status-justify centre

## Keybindings to vi
set-option -g status-keys vi
set-option -g status-position bottom

set -g status-left-length 20
set -g status-right-length 140

## Example: use the #() to execute arbitrary shell commands
## set -g status-right ' #(whoami)@#h %F %T (#(echo "foo")) '
set -g status-right '( #($HOME/.config/blocklets/disk --no-colour)) ( #($HOME/.config/blocklets/memory)) ( #($HOME/.config/blocklets/cpu_usage -n=1)) #(whoami)@#h %F %T'

